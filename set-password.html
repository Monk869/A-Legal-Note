
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Password | A Legal Note</title>
<style>
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#f7f5f0;
  font-family:Arial,sans-serif;
  color:#26343b;
}
.card {
  width:min(400px,85%);
  background:white;
  padding:30px;
  border:1px solid #e5e0d6;
  border-radius:8px;
}
h1 {font-family:Georgia,serif;font-weight:normal}
p {color:#68747a;line-height:1.7;font-size:14px}
label {display:block;margin:16px 0 7px;font-size:12px}
input {
  box-sizing:border-box;
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:4px;
}
button {
  width:100%;
  padding:13px;
  margin-top:18px;
  border:0;
  background:#172b3a;
  color:white;
  cursor:pointer;
  border-radius:4px;
}
.message {font-size:13px;color:#35724d}
.error {color:#ae3838}
a {color:#986e43}
</style>
</head>
<body>
<div class="card">
  <h1>Set your password.</h1>
  <p id="description">Secure your A Legal Note administrator account.</p>

  <form id="passwordForm" hidden>
    <label>New password</label>
    <input id="password" type="password"
      minlength="8" required autocomplete="new-password">

    <label>Confirm password</label>
    <input id="confirm" type="password"
      minlength="8" required autocomplete="new-password">

    <button type="submit">Save password</button>
  </form>

  <form id="recoveryForm" hidden>
    <p>Your invitation session is no longer active. Request a password setup link by email.</p>
    <label>Email address</label>
    <input id="email" type="email" required>
    <button type="submit">Send password setup link</button>
  </form>

  <p id="message" class="message"></p>
  <a href="admin.html">Return to administrator login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const cfg = window.LEGAL_SITE_CONFIG;
const message = document.getElementById("message");

function showMessage(text,error=false) {
  message.textContent=text;
  message.className=error?"message error":"message";
}

const recoveryURL =
  "https://monk869.github.io/A-Legal-Note/set-password.html";

const db = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);

async function initialize() {
  const {data,error}=await db.auth.getSession();

  if(error) {
    showMessage(error.message,true);
    return;
  }

  const session=data.session;

  if(session) {
    if(session.user.email.toLowerCase() !==
       cfg.ADMIN_EMAIL.toLowerCase()) {
      showMessage("This account is not the site administrator.",true);
      await db.auth.signOut();
      return;
    }

    document.getElementById("passwordForm").hidden=false;
    document.getElementById("recoveryForm").hidden=true;
    return;
  }

  document.getElementById("recoveryForm").hidden=false;
  document.getElementById("email").value=cfg.ADMIN_EMAIL;
}

document.getElementById("passwordForm")
.addEventListener("submit",async function(e) {
  e.preventDefault();

  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<8) {
    showMessage("Use at least 8 characters.",true);
    return;
  }

  if(password!==confirm) {
    showMessage("Passwords do not match.",true);
    return;
  }

  const {error}=await db.auth.updateUser({password});

  if(error) {
    showMessage(error.message,true);
    return;
  }

  showMessage("Password saved successfully! Opening dashboard...");

  setTimeout(()=>{
    window.location.href="admin.html";
  },1500);
});

document.getElementById("recoveryForm")
.addEventListener("submit",async function(e) {
  e.preventDefault();

  const email=document.getElementById("email").value.trim();

  if(email.toLowerCase()!==cfg.ADMIN_EMAIL.toLowerCase()) {
    showMessage("Use your configured administrator email.",true);
    return;
  }

  const {error}=await db.auth.resetPasswordForEmail(email,{
    redirectTo:recoveryURL
  });

  if(error) {
    showMessage(error.message,true);
    return;
  }

  showMessage("Password setup email sent. Check your inbox.");
});

initialize();
</script>
</body>
</html>
